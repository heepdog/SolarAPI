[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apsystems-openapi"
version = "0.1.0"
description = "Python client and CLI for the APsystems OpenAPI"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
]

[project.scripts]
apsystems-energy = "solar_api.cli:main"

[tool.setuptools.packages.find]
include = ["solar_api*"]
